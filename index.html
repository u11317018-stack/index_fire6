<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蚋裡的廟 — 加蚋地區集章趣</title>
    <style>
        :root {
            --primary-green: #82c0a6;
            --primary-orange: #d99441;
            --primary-red: #bf2c2c;
            --bg-cream: #fbf9f5;
            --text-dark: #333333;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 標題與副標 */
        .header-container {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
            border-bottom: 3px double var(--primary-orange);
            padding-bottom: 15px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: var(--primary-red);
            font-size: 32px;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--primary-green);
            font-size: 18px;
            font-weight: bold;
            margin: 0;
            letter-spacing: 1px;
        }

        /* 集章卡區域 */
        .stamp-card {
            background: white;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(217, 148, 65, 0.15);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 30px;
            box-sizing: border-box;
            border: 2px solid #f0eae1;
        }

        .stamp-slot {
            aspect-ratio: 1;
            border: 2px dashed #ccc;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #fafafa;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .stamp-slot.active {
            border: 2px solid var(--primary-red);
            background-color: #fffbfb;
        }

        .temple-name {
            font-size: 12px;
            font-weight: bold;
            color: #888;
            margin-bottom: 8px;
            z-index: 1;
            text-align: center;
            padding: 0 5px;
        }
        .stamp-slot.active .temple-name {
            color: var(--primary-red);
        }

        .temple-thumb {
            width: 55%;
            height: auto;
            opacity: 0.4;
            margin-bottom: 8px;
            transition: opacity 0.4s;
            z-index: 1;
        }
        .stamp-slot.active .temple-thumb {
            opacity: 0.15;
        }

        .stamp-status {
            font-size: 11px;
            color: #bbb;
            background: #eee;
            padding: 2px 6px;
            border-radius: 10px;
            z-index: 1;
        }

        /* 古風印章 */
        .stamp-mark {
            display: none;
            width: 75px;
            height: 75px;
            border: 3px solid var(--primary-red);
            border-radius: 50%;
            color: var(--primary-red);
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            justify-content: center;
            align-items: center;
            transform: rotate(-15deg);
            position: absolute;
            background: rgba(255,255,255,0.85);
            box-shadow: inset 0 0 4px rgba(191, 44, 44, 0.2);
            animation: stampDrop 0.3s ease-out forwards;
            z-index: 2;
            padding: 5px;
            box-sizing: border-box;
        }

        .stamp-slot.active .stamp-mark {
            display: flex;
        }
        .stamp-slot.active .stamp-status {
            display: none;
        }

        /* 動作按鈕 */
        .action-btn {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(130, 192, 166, 0.4);
            transition: all 0.2s;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        /* 📸 真相機掃描視窗彈窗 */
        .scanner-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* 真實相機畫面渲染區 */
        .scan-window {
            width: 280px;
            height: 280px;
            border: 3px solid var(--primary-orange);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            background: #222;
        }

        /* 掃描動態紅線 */
        .scan-line {
            width: 100%;
            height: 3px;
            background-color: #ff3b30;
            position: absolute;
            top: 0;
            box-shadow: 0 0 8px #ff3b30;
            animation: scanMove 2s linear infinite;
            z-index: 10;
        }

        .scan-tip {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 25px;
            text-align: center;
            padding: 0 20px;
        }

        .close-scan-btn {
            background-color: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 10px 30px;
            font-size: 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* YouTube 獎勵全螢幕彈窗 */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .video-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-ui-layer {
            text-align: center;
            color: white;
            margin-top: 15px;
            padding: 0 20px;
            animation: fadeIn 1s ease;
        }

        .video-title {
            font-size: 22px;
            color: var(--primary-orange);
            margin-bottom: 5px;
            font-weight: bold;
        }

        .video-hint {
            font-size: 13px;
            color: #ffda79;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        .video-btn-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            justify-content: center;
        }

        .video-control-btn {
            background: transparent;
            border: 1px solid #ffffff;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .video-control-btn:hover {
            background: white;
            color: black;
        }

        .reset-btn {
            margin-top: 40px;
            background: none;
            border: 1px solid #ccc;
            color: #999;
            padding: 6px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .watch-video-bonus-btn {
            display: none;
            background-color: var(--primary-red);
            margin-top: 15px;
        }

        @keyframes scanMove {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        @keyframes stampDrop {
            0% { transform: scale(3) rotate(-45deg); opacity: 0; }
            100% { transform: scale(1) rotate(-15deg); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>蚋裡的廟</h1>
        <div class="subtitle">加蚋地區集章趣</div>
    </div>

    <div class="stamp-card">
        <div class="stamp-slot" id="slot-0">
            <div class="temple-name">廣照宮</div>
            <img class="temple-thumb" src="templeA.jpg" alt="廣照宮">
            <div class="stamp-status">未解鎖</div>
            <div class="stamp-mark">廣照宮印</div>
        </div>
        <div class="stamp-slot" id="slot-1">
            <div class="temple-name">壽德公園塗鴉牆</div>
            <img class="temple-thumb" src="templeB.jpg" alt="壽德公園">
            <div class="stamp-status">未解鎖</div>
            <div class="stamp-mark">壽德公園<br>塗鴉牆印</div>
        </div>
        <div class="stamp-slot" id="slot-2">
            <div class="temple-name">豆芽巷</div>
            <img class="temple-thumb" src="templeC.jpg" alt="豆芽巷">
            <div class="stamp-status">未解鎖</div>
            <div class="stamp-mark">豆芽巷印</div>
        </div>
        <div class="stamp-slot" id="slot-3">
            <div class="temple-name">廣照宮塗鴉</div>
            <img class="temple-thumb" src="templeD.jpg" alt="廣照宮塗鴉">
            <div class="stamp-status">未解鎖</div>
            <div class="stamp-mark">廣照宮<br>塗鴉印</div>
        </div>
    </div>

    <button class="action-btn" id="mainScanBtn" onclick="openScanner()">📷 開啟相機掃描圖片</button>
    <button class="action-btn watch-video-bonus-btn" id="bonusVideoBtn" onclick="openVideoModal()">🎬 觀看解鎖影片</button>
    
    <button class="reset-btn" onclick="resetGame()">重置集章進度</button>

    <div class="scanner-modal" id="scannerModal">
        <div class="scan-window">
            <div class="scan-line"></div>
            <div id="reader" style="width: 100%; height: 100%;"></div>
        </div>
        <div class="scan-tip">請對準景點現場的指定集章 QR Code</div>
        <button class="close-scan-btn" onclick="closeScanner()">關閉相機</button>
    </div>

    <div class="video-modal" id="videoModal">
        <div class="video-container">
            <div id="ytPlayer"></div>
        </div>
        <div class="video-ui-layer">
            <div class="video-title">🎉 恭喜解鎖彩蛋影片！</div>
            <div class="video-hint">🔊 提示：如果沒有聲音，請點擊影片裡的喇叭解鎖音量喔！</div>
            <div class="video-btn-group">
                <button class="video-control-btn" onclick="replayVideo()">🔁 重新播放</button>
                <button class="video-control-btn" style="background: var(--primary-orange); border-color: var(--primary-orange);" onclick="closeVideoModal()">返回集章卡</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <script>
        // 💡 1. 換上你的 YouTube 影片 ID
        const YOUTUBE_VIDEO_ID = 'L_8HwlZSBhA'; 

        let player; 
        let html5QrCode = null; // 用來存放相機實體
        let stampProgress = JSON.parse(localStorage.getItem('ganai_stamps')) || [false, false, false, false];

        // YouTube 初始化
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                videoId: YOUTUBE_VIDEO_ID,
                playerVars: {
                    'autoplay': 0, 'mute': 1, 'controls': 1, 'rel': 0, 'playsinline': 1
                }
            });
        }

        // 渲染更新蓋章狀態
        function updateDisplay() {
            stampProgress.forEach((isStamped, index) => {
                const slot = document.getElementById(`slot-${index}`);
                if (isStamped) {
                    slot.classList.add('active');
                } else {
                    slot.classList.remove('active');
                }
            });

            if (stampProgress.every(status => status === true)) {
                document.getElementById('mainScanBtn').style.display = 'none';
                document.getElementById('bonusVideoBtn').style.display = 'block';
                
                if(!sessionStorage.getItem('videoAlreadyShown')) {
                    setTimeout(() => {
                        openVideoModal();
                        sessionStorage.setItem('videoAlreadyShown', 'true');
                    }, 800); 
                }
            } else {
                document.getElementById('mainScanBtn').style.display = 'block';
                document.getElementById('bonusVideoBtn').style.display = 'none';
            }
        }

        // 📷 真正啟動手機相機（手機權限強化版）
        function openScanner() {
            // 🔴 第一步：先請求相機權限（不開 modal）
            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            })
            .then((stream) => {
                // ✅ 權限已允許，正式開啟掃描 modal
                console.log("✅ 相機權限已獲得");
                
                // 停止流以便 Html5QrCode 重新使用
                stream.getTracks().forEach(track => track.stop());
                
                // 現在才打開 modal
                document.getElementById('scannerModal').style.display = 'flex';
                
                // 初始化相機元件
                if (!html5QrCode) {
                    html5QrCode = new Html5QrCode("reader");
                }

                const config = { 
                    fps: 15,
                    qrbox: function(viewfinderWidth, viewfinderHeight) {
                        const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                        const edgeSize = Math.floor(minEdge * 0.7);
                        return { width: edgeSize, height: edgeSize };
                    },
                    aspectRatio: 1.0
                };

                html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    onScanSuccess, 
                    onScanFailure
                ).catch(err => {
                    console.error("QR Code 啟動失敗:", err);
                    alert("❌ QR Code 掃描啟動失敗：" + err);
                    closeScanner();
                });
            })
            .catch(err => {
                // ❌ 權限被拒絕或其他錯誤
                console.error("相機權限錯誤:", err);
                
                let errorMsg = "⚠️ 相機啟動失敗！\n\n";
                if (err.name === 'NotAllowedError') {
                    errorMsg += "❌ 你拒絕了相機權限。\n請進入瀏覽器設定，允許此網站使用相機。";
                } else if (err.name === 'NotFoundError') {
                    errorMsg += "❌ 找不到相機。\n請確認你的手機有相機功能。";
                } else if (err.name === 'NotReadableError') {
                    errorMsg += "❌ 相機被其他應用佔用。\n請關閉其他使用相機的應用，再試一次。";
                } else {
                    errorMsg += "❌ " + err.message;
                }
                
                errorMsg += "\n\n💡 如果是用 LINE 打開，請改用 Safari 或 Chrome！";
                
                alert(errorMsg);
            });
        }

        // 🛑 關閉並釋放相機鏡頭
        function closeScanner() {
            document.getElementById('scannerModal').style.display = 'none';
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    console.log("相機已關閉");
                }).catch(err => console.error("關閉相機失敗", err));
            }
        }

        // 🎯 【核心核心！】當相機成功掃到任何 QR Code 時會執行這裡
        function onScanSuccess(decodedText, decodedResult) {
            console.log(`掃描成功，內容為: ${decodedText}`);
            
            let matchedIndex = -1;

            // 💡 判斷掃描到的文字是什麼，來決定蓋哪一個章
            if (decodedText === "ganai_pic_A") {
                matchedIndex = 0; // 廣照宮
            } else if (decodedText === "ganai_pic_B") {
                matchedIndex = 1; // 壽德公園
            } else if (decodedText === "ganai_pic_C") {
                matchedIndex = 2; // 豆芽巷
            } else if (decodedText === "ganai_pic_D") {
                matchedIndex = 3; // 廣照宮塗鴉
            }

            if (matchedIndex !== -1) {
                // 成功對應！進行蓋章
                if (!stampProgress[matchedIndex]) {
                    stampProgress[matchedIndex] = true;
                    localStorage.setItem('ganai_stamps', JSON.stringify(stampProgress));
                    alert("✨ 成功採集到一個新印章！");
                } else {
                    alert("這個地方你已經集過章囉！");
                }
                closeScanner();
                updateDisplay();
            }
        }

        // 掃描過程中沒對準、失焦時的訊號
        function onScanFailure(error) {
            // console.warn(`掃描中: ${error}`);
        }

        // 影片控制
        function openVideoModal() {
            document.getElementById('videoModal').style.display = 'flex';
            if (player && typeof player.playVideo === 'function') {
                player.mute(); 
                player.seekTo(0);
                player.playVideo();
            }
        }

        function closeVideoModal() {
            document.getElementById('videoModal').style.display = 'none';
            if (player && typeof player.pauseVideo === 'function') {
                player.pauseVideo();
            }
        }

        function replayVideo() {
            if (player && typeof player.playVideo === 'function') {
                player.seekTo(0);
                player.playVideo();
            }
        }

        function resetGame() {
            if (confirm("確定要重置所有進度嗎？")) {
                stampProgress = [false, false, false, false];
                localStorage.setItem('ganai_stamps', JSON.stringify(stampProgress));
                sessionStorage.removeItem('videoAlreadyShown');
                updateDisplay();
            }
        }

        updateDisplay();
    </script>
</body>
</html>
